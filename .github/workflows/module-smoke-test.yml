name: Module Smoke Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-and-cli:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout module repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate installer idempotency and config preservation
        shell: bash
        run: |
          set -euo pipefail

          TARGET_DIR="$RUNNER_TEMP/kicad-target"
          mkdir -p "$TARGET_DIR/hardware"

          cat > "$TARGET_DIR/hardware/demo.kicad_pro" <<'JSON'
          {
            "board": {
              "design_settings": {}
            },
            "text_variables": {}
          }
          JSON

          cat > "$TARGET_DIR/hardware/demo.kicad_pcb" <<'PCB'
          (kicad_pcb
            (version 20240217)
            (generator "module-smoke-test")
            (layers
              (0 "F.Cu" signal)
              (1 "In1.Cu" signal)
              (2 "In2.Cu" signal)
              (31 "B.Cu" signal)
              (32 "B.Adhes" user)
              (33 "F.Adhes" user)
              (34 "B.Paste" user)
              (35 "F.Paste" user)
              (36 "B.SilkS" user)
              (37 "F.SilkS" user)
              (38 "B.Mask" user)
              (39 "F.Mask" user)
              (44 "Edge.Cuts" user)
            )
          )
          PCB

          KICAD_RELEASE_AUTOMATION_VERSION="module-v1.0.0" \
            KICAD_RELEASE_AUTOMATION_REPO="example/kicad-release-automation-module" \
            ./install.sh "$TARGET_DIR"

          cat > "$TARGET_DIR/release-artifacts.json" <<'JSON'
          {
            "project": {
              "path": "hardware/demo.kicad_pro"
            },
            "gerber": {
              "include_layers": [
                "F.Cu",
                "In1.Cu",
                "In2.Cu",
                "B.Cu",
                "F.Paste",
                "B.Paste",
                "F.SilkS",
                "B.SilkS",
                "F.Mask",
                "B.Mask",
                "Edge.Cuts"
              ]
            }
          }
          JSON

          cp "$TARGET_DIR/release-artifacts.json" "$TARGET_DIR/release-artifacts.json.before"
          KICAD_RELEASE_AUTOMATION_VERSION="module-v1.0.0" \
            KICAD_RELEASE_AUTOMATION_REPO="example/kicad-release-automation-module" \
            ./install.sh "$TARGET_DIR"
          cmp "$TARGET_DIR/release-artifacts.json" "$TARGET_DIR/release-artifacts.json.before"
          test -f "$TARGET_DIR/.kicad-release-automation-version.json"
          test -f "$TARGET_DIR/scripts/check_release_automation_update.py"
          test -f "$TARGET_DIR/scripts/find_kicad_cli.py"

          python3 - "$TARGET_DIR" <<'PY'
          import json
          import sys
          from pathlib import Path

          target_dir = Path(sys.argv[1])
          metadata_path = target_dir / ".kicad-release-automation-version.json"
          payload = json.loads(metadata_path.read_text(encoding="utf-8"))

          assert payload["schema_version"] == 2
          assert payload["installed_version"] == "module-v1.0.0"
          assert payload["module_version"] == "module-v1.0.0"
          assert "installed_at" in payload

          managed_files = payload.get("managed_files")
          assert isinstance(managed_files, dict)
          assert "scripts/generate_release_artifacts.py" in managed_files
          assert "scripts/check_release_automation_update.py" in managed_files
          assert "scripts/find_kicad_cli.py" in managed_files
          assert ".github/workflows/release-gerbers.yml" in managed_files
          for details in managed_files.values():
            assert isinstance(details, dict)
            assert isinstance(details.get("sha256"), str) and details["sha256"]
            assert details.get("version") == "module-v1.0.0"
          PY

      - name: Validate local CLI dry-run behavior
        shell: bash
        run: |
          set -euo pipefail

          TARGET_DIR="$RUNNER_TEMP/kicad-target"
          pushd "$TARGET_DIR" >/dev/null

          python3 scripts/generate_release_artifacts.py \
            --config release-artifacts.json \
            --tag r1.2.3 \
            --dry-run \
            --no-update-release-variable

          python3 scripts/generate_release_artifacts.py \
            --config release-artifacts.json \
            --release 1.2.3 \
            --dry-run

          cp hardware/demo.kicad_pro hardware/demo-aux.kicad_pro
          cp hardware/demo.kicad_pcb hardware/demo-aux.kicad_pcb

          cat > release-artifacts-multi.json <<'JSON'
          {
            "defaults": {
              "gerber": {
                "include_layers": [
                  "F.Cu",
                  "In1.Cu",
                  "In2.Cu",
                  "B.Cu",
                  "F.Paste",
                  "B.Paste",
                  "F.SilkS",
                  "B.SilkS",
                  "F.Mask",
                  "B.Mask",
                  "Edge.Cuts"
                ]
              }
            },
            "projects": [
              {
                "id": "demo-main",
                "path": "hardware/demo.kicad_pro"
              },
              {
                "id": "demo-aux",
                "path": "hardware/demo-aux.kicad_pro"
              }
            ]
          }
          JSON

          python3 scripts/generate_release_artifacts.py \
            --config release-artifacts-multi.json \
            --release 1.2.3 \
            --project-id demo-aux \
            --dry-run

          python3 scripts/generate_release_artifacts.py \
            --config release-artifacts-multi.json \
            --release demo-aux/1.2.3 \
            --dry-run

          python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          module_path = Path("scripts/generate_release_artifacts.py")
          spec = importlib.util.spec_from_file_location("release_mod", module_path)
          mod = importlib.util.module_from_spec(spec)
          assert spec is not None and spec.loader is not None
          spec.loader.exec_module(mod)

          assert mod.windows_to_wsl_path(r"D:\\pcbs\\board.kicad_pro") == "/mnt/d/pcbs/board.kicad_pro"

          os.environ["WSL_DISTRO_NAME"] = "UnitTest"
          converted = mod.normalize_user_path(
            r"D:\\pcbs\\board.kicad_pro",
            Path.cwd(),
            context="unit-test",
          )
          assert str(converted) == "/mnt/d/pcbs/board.kicad_pro"
          assert mod.cli_uses_windows_paths("/mnt/c/Program Files/KiCad/10.99/bin/kicad-cli.exe") is True
          assert mod.format_path_for_cli(Path("/mnt/d/pcbs/board.kicad_pro"), True) == r"D:\pcbs\board.kicad_pro"

          try:
            mod.normalize_user_path(r"\\\\server\\share\\board.kicad_pro", Path.cwd(), context="unit-test")
          except SystemExit:
            pass
          else:
            raise AssertionError("UNC path should fail")
          PY

          popd >/dev/null

      - name: Validate update-check helper behavior
        shell: bash
        run: |
          set -euo pipefail

          TARGET_DIR="$RUNNER_TEMP/kicad-target"
          python3 - "$TARGET_DIR" <<'PY'
          import http.server
          import json
          import socketserver
          import subprocess
          import sys
          import threading
          from pathlib import Path

          target_dir = Path(sys.argv[1])
          helper_path = target_dir / "scripts/check_release_automation_update.py"
          metadata_path = target_dir / ".kicad-release-automation-version.json"

          class Handler(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
              if self.path != "/repos/example/kicad-release-automation-module/releases/latest":
                self.send_response(404)
                self.end_headers()
                return

              payload = json.dumps({"tag_name": "module-v1.3.0"}).encode("utf-8")
              self.send_response(200)
              self.send_header("Content-Type", "application/json")
              self.send_header("Content-Length", str(len(payload)))
              self.end_headers()
              self.wfile.write(payload)

            def log_message(self, format, *args):
              return

          with socketserver.TCPServer(("127.0.0.1", 0), Handler) as server:
            port = server.server_address[1]
            thread = threading.Thread(target=server.serve_forever, daemon=True)
            thread.start()
            try:
              result = subprocess.run(
                [
                  sys.executable,
                  str(helper_path),
                  "--metadata",
                  str(metadata_path),
                  "--api-base-url",
                  f"http://127.0.0.1:{port}",
                  "--json",
                ],
                check=True,
                capture_output=True,
                text=True,
              )
            finally:
              server.shutdown()
              thread.join()

          payload = json.loads(result.stdout)
          assert payload["installed_version"] == "module-v1.0.0"
          assert payload["latest_release"] == "module-v1.3.0"
          assert payload["update_available"] is True

          verify_result = subprocess.run(
            [
              sys.executable,
              str(helper_path),
              "--metadata",
              str(metadata_path),
              "--verify",
              "--json",
            ],
            check=True,
            capture_output=True,
            text=True,
          )
          verify_payload = json.loads(verify_result.stdout)
          assert verify_payload["verified"] is True
          assert verify_payload["valid"] is True
          assert len(verify_payload["files"]) == 3

          legacy_metadata_path = target_dir / ".kicad-release-automation-version-legacy.json"
          legacy_metadata_path.write_text(
            json.dumps(
              {
                "module_repo": "example/kicad-release-automation-module",
                "installed_version": "module-v1.0.0",
              }
            ),
            encoding="utf-8",
          )

          legacy_result = subprocess.run(
            [
              sys.executable,
              str(helper_path),
              "--metadata",
              str(legacy_metadata_path),
              "--api-base-url",
              f"http://127.0.0.1:{port}",
              "--json",
            ],
            check=True,
            capture_output=True,
            text=True,
          )
          legacy_payload = json.loads(legacy_result.stdout)
          assert legacy_payload["installed_version"] == "module-v1.0.0"
          assert legacy_payload["update_available"] is True
          PY
