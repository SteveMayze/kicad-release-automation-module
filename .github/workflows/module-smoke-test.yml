name: Module Smoke Test

on:
  pull_request:
  workflow_dispatch:
    inputs:
      kicad_image:
        description: "KiCad image for the e2e-real-kicad job (default: KICAD_IMAGE from the workflow template)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  lint-workflows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout module repository
        uses: actions/checkout@v5

      - name: Run actionlint on module and template workflows
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color \
            .github/workflows/*.yml templates/.github/workflows/*.yml

  installer-and-cli:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout module repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate installer idempotency and config preservation
        shell: bash
        run: |
          set -euo pipefail

          TARGET_DIR="$RUNNER_TEMP/kicad-target"
          mkdir -p "$TARGET_DIR/hardware"

          cat > "$TARGET_DIR/hardware/demo.kicad_pro" <<'JSON'
          {
            "board": {
              "design_settings": {}
            },
            "text_variables": {}
          }
          JSON

          cat > "$TARGET_DIR/hardware/demo.kicad_pcb" <<'PCB'
          (kicad_pcb
            (version 20240217)
            (generator "module-smoke-test")
            (layers
              (0 "F.Cu" signal)
              (1 "In1.Cu" signal)
              (2 "In2.Cu" signal)
              (31 "B.Cu" signal)
              (32 "B.Adhes" user)
              (33 "F.Adhes" user)
              (34 "B.Paste" user)
              (35 "F.Paste" user)
              (36 "B.SilkS" user)
              (37 "F.SilkS" user)
              (38 "B.Mask" user)
              (39 "F.Mask" user)
              (44 "Edge.Cuts" user)
            )
          )
          PCB

          KICAD_RELEASE_AUTOMATION_VERSION="module-v1.0.0" \
            KICAD_RELEASE_AUTOMATION_REPO="example/kicad-release-automation-module" \
            ./install.sh "$TARGET_DIR"

          cat > "$TARGET_DIR/release-artifacts.json" <<'JSON'
          {
            "project": {
              "path": "hardware/demo.kicad_pro"
            },
            "gerber": {
              "include_layers": [
                "F.Cu",
                "In1.Cu",
                "In2.Cu",
                "B.Cu",
                "F.Paste",
                "B.Paste",
                "F.SilkS",
                "B.SilkS",
                "F.Mask",
                "B.Mask",
                "Edge.Cuts"
              ]
            }
          }
          JSON

          cp "$TARGET_DIR/release-artifacts.json" "$TARGET_DIR/release-artifacts.json.before"
          KICAD_RELEASE_AUTOMATION_VERSION="module-v1.0.0" \
            KICAD_RELEASE_AUTOMATION_REPO="example/kicad-release-automation-module" \
            ./install.sh "$TARGET_DIR"
          cmp "$TARGET_DIR/release-artifacts.json" "$TARGET_DIR/release-artifacts.json.before"
          test -f "$TARGET_DIR/.kicad-release-automation-version.json"
          test -f "$TARGET_DIR/scripts/check_release_automation_update.py"
          test -f "$TARGET_DIR/scripts/find_kicad_cli.py"
          test -f "$TARGET_DIR/scripts/setup_kicad_cli_container.sh"
          test -f "$TARGET_DIR/scripts/package_release_artifacts.sh"

          python3 - "$TARGET_DIR" <<'PY'
          import json
          import sys
          from pathlib import Path

          target_dir = Path(sys.argv[1])
          metadata_path = target_dir / ".kicad-release-automation-version.json"
          payload = json.loads(metadata_path.read_text(encoding="utf-8"))

          assert payload["schema_version"] == 2
          assert payload["installed_version"] == "module-v1.0.0"
          assert payload["module_version"] == "module-v1.0.0"
          assert "installed_at" in payload

          managed_files = payload.get("managed_files")
          assert isinstance(managed_files, dict)
          assert "scripts/generate_release_artifacts.py" in managed_files
          assert "scripts/check_release_automation_update.py" in managed_files
          assert "scripts/find_kicad_cli.py" in managed_files
          assert "scripts/setup_kicad_cli_container.sh" in managed_files
          assert "scripts/package_release_artifacts.sh" in managed_files
          assert len(managed_files) == 6
          assert ".github/workflows/release-gerbers.yml" in managed_files
          for details in managed_files.values():
            assert isinstance(details, dict)
            assert isinstance(details.get("sha256"), str) and details["sha256"]
            assert details.get("version") == "module-v1.0.0"
          PY

      - name: Validate local CLI dry-run behavior
        shell: bash
        run: |
          set -euo pipefail

          TARGET_DIR="$RUNNER_TEMP/kicad-target"
          pushd "$TARGET_DIR" >/dev/null

          cp hardware/demo.kicad_pro "$RUNNER_TEMP/demo.kicad_pro.before"

          python3 scripts/generate_release_artifacts.py \
            --config release-artifacts.json \
            --tag r1.2.3 \
            --dry-run \
            --no-update-release-variable

          python3 scripts/generate_release_artifacts.py \
            --config release-artifacts.json \
            --release 1.2.3 \
            --dry-run

          # --dry-run must not modify project files or create output directories.
          cmp hardware/demo.kicad_pro "$RUNNER_TEMP/demo.kicad_pro.before"
          test ! -e gerber

          cp hardware/demo.kicad_pro hardware/demo-aux.kicad_pro
          cp hardware/demo.kicad_pcb hardware/demo-aux.kicad_pcb

          cat > release-artifacts-multi.json <<'JSON'
          {
            "defaults": {
              "gerber": {
                "include_layers": [
                  "F.Cu",
                  "In1.Cu",
                  "In2.Cu",
                  "B.Cu",
                  "F.Paste",
                  "B.Paste",
                  "F.SilkS",
                  "B.SilkS",
                  "F.Mask",
                  "B.Mask",
                  "Edge.Cuts"
                ]
              }
            },
            "projects": [
              {
                "id": "demo-main",
                "path": "hardware/demo.kicad_pro"
              },
              {
                "id": "demo-aux",
                "path": "hardware/demo-aux.kicad_pro"
              }
            ]
          }
          JSON

          python3 scripts/generate_release_artifacts.py \
            --config release-artifacts-multi.json \
            --release 1.2.3 \
            --project-id demo-aux \
            --dry-run

          python3 scripts/generate_release_artifacts.py \
            --config release-artifacts-multi.json \
            --release demo-aux/1.2.3 \
            --dry-run

          cmp hardware/demo.kicad_pro "$RUNNER_TEMP/demo.kicad_pro.before"
          cmp hardware/demo-aux.kicad_pro "$RUNNER_TEMP/demo.kicad_pro.before"
          test ! -e gerber

          python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          module_path = Path("scripts/generate_release_artifacts.py")
          spec = importlib.util.spec_from_file_location("release_mod", module_path)
          mod = importlib.util.module_from_spec(spec)
          assert spec is not None and spec.loader is not None
          spec.loader.exec_module(mod)

          assert mod.windows_to_wsl_path(r"D:\pcbs\board.kicad_pro") == "/mnt/d/pcbs/board.kicad_pro"

          os.environ["WSL_DISTRO_NAME"] = "UnitTest"
          converted = mod.normalize_user_path(
            r"D:\pcbs\board.kicad_pro",
            Path.cwd(),
            context="unit-test",
          )
          assert str(converted) == "/mnt/d/pcbs/board.kicad_pro"
          assert mod.cli_uses_windows_paths("/mnt/c/Program Files/KiCad/10.99/bin/kicad-cli.exe") is True
          assert mod.format_path_for_cli(Path("/mnt/d/pcbs/board.kicad_pro"), True) == r"D:\pcbs\board.kicad_pro"

          try:
            mod.normalize_user_path(r"\\server\share\board.kicad_pro", Path.cwd(), context="unit-test")
          except SystemExit:
            pass
          else:
            raise AssertionError("UNC path should fail")
          PY

          popd >/dev/null

      - name: Validate manifest and version preflight with a stub kicad-cli
        shell: bash
        run: |
          set -euo pipefail

          TARGET_DIR="$RUNNER_TEMP/kicad-target"
          STUB_DIR="$RUNNER_TEMP/stub-kicad"
          mkdir -p "$STUB_DIR"

          # Stand-in for kicad-cli: answers --version and drops one marker file into
          # the --output directory for each export command.
          cat > "$STUB_DIR/kicad-cli" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == "--version" ]]; then
            echo "${STUB_KICAD_VERSION:-10.0.0}"
            exit 0
          fi
          KIND="${3:-unknown}"
          OUT=""
          while [[ $# -gt 0 ]]; do
            if [[ "$1" == "--output" ]]; then
              OUT="$2"
            fi
            shift
          done
          touch "$OUT/stub-$KIND.txt"
          SH
          chmod +x "$STUB_DIR/kicad-cli"
          export KICAD_CLI="$STUB_DIR/kicad-cli"

          pushd "$TARGET_DIR" >/dev/null

          # Selective multi-project run with an explicit manifest path.
          python3 scripts/generate_release_artifacts.py \
            --config release-artifacts-multi.json \
            --release 1.2.3 \
            --project-id demo-aux \
            --output-dir .release-out/gerber \
            --manifest .release-out/release-manifest.json

          test -f .release-out/gerber/demo-aux/stub-gerbers.txt
          test -f .release-out/gerber/demo-aux/stub-drill.txt
          test ! -e .release-out/gerber/demo-main
          test ! -e gerber

          # Legacy single-project run with the default manifest location.
          python3 scripts/generate_release_artifacts.py \
            --config release-artifacts.json \
            --release 1.2.3 \
            --output-dir .release-out/legacy

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path(".release-out/release-manifest.json").read_text(encoding="utf-8"))
          assert manifest["schema_version"] == 1
          assert manifest["release"] == "1.2.3"
          assert manifest["projects"] == [
            {
              "id": "demo-aux",
              "project_file": "hardware/demo-aux.kicad_pro",
              "output_dir": ".release-out/gerber/demo-aux",
              "release": "1.2.3",
            }
          ], manifest["projects"]

          legacy = json.loads(Path(".release-out/legacy/release-manifest.json").read_text(encoding="utf-8"))
          assert legacy["projects"] == [
            {
              "id": "demo",
              "project_file": "hardware/demo.kicad_pro",
              "output_dir": ".release-out/legacy",
              "release": "1.2.3",
            }
          ], legacy["projects"]

          for name in ("demo", "demo-aux"):
            project = json.loads(Path(f"hardware/{name}.kicad_pro").read_text(encoding="utf-8"))
            assert project["text_variables"]["RELEASE"] == "1.2.3"
          PY

          # Version preflight: a board saved by KiCad 10 must be rejected by an older CLI.
          cp hardware/demo.kicad_pro hardware/demo-v10.kicad_pro
          sed 's/(generator "module-smoke-test")/(generator "module-smoke-test")\n  (generator_version "10.0")/' \
            hardware/demo.kicad_pcb > hardware/demo-v10.kicad_pcb
          grep -q 'generator_version "10.0"' hardware/demo-v10.kicad_pcb

          if STUB_KICAD_VERSION="9.0.1" KICAD_IMAGE="example/kicad:9.0" \
            python3 scripts/generate_release_artifacts.py \
              --config release-artifacts.json \
              --project hardware/demo-v10.kicad_pro \
              --release 1.2.3 \
              --output-dir .release-out/v10 2> "$RUNNER_TEMP/preflight.err"; then
            echo "Expected the version preflight to fail for an older kicad-cli." >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/preflight.err"
          grep -q 'demo-v10.kicad_pcb' "$RUNNER_TEMP/preflight.err"
          grep -q 'saved by KiCad 10.0' "$RUNNER_TEMP/preflight.err"
          grep -q 'kicad-cli is version 9.0.1' "$RUNNER_TEMP/preflight.err"
          grep -q 'KICAD_IMAGE (currently: example/kicad:9.0)' "$RUNNER_TEMP/preflight.err"
          test ! -e .release-out/v10

          STUB_KICAD_VERSION="10.0.8" \
            python3 scripts/generate_release_artifacts.py \
              --config release-artifacts.json \
              --project hardware/demo-v10.kicad_pro \
              --release 1.2.3 \
              --output-dir .release-out/v10
          test -f .release-out/v10/release-manifest.json

          # In --dry-run without any kicad-cli the check is skipped.
          env -u KICAD_CLI PATH="/usr/bin:/bin" \
            python3 scripts/generate_release_artifacts.py \
              --config release-artifacts.json \
              --project hardware/demo-v10.kicad_pro \
              --release 1.2.3 \
              --dry-run > "$RUNNER_TEMP/preflight-dry-run.out"
          grep -q 'Skipping board/kicad-cli version check' "$RUNNER_TEMP/preflight-dry-run.out"

          popd >/dev/null

      - name: Validate update-check helper behavior
        shell: bash
        run: |
          set -euo pipefail

          TARGET_DIR="$RUNNER_TEMP/kicad-target"
          python3 - "$TARGET_DIR" <<'PY'
          import http.server
          import json
          import socketserver
          import subprocess
          import sys
          import threading
          from pathlib import Path

          target_dir = Path(sys.argv[1])
          helper_path = target_dir / "scripts/check_release_automation_update.py"
          metadata_path = target_dir / ".kicad-release-automation-version.json"

          class Handler(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
              if self.path != "/repos/example/kicad-release-automation-module/releases/latest":
                self.send_response(404)
                self.end_headers()
                return

              payload = json.dumps({"tag_name": "module-v1.3.0"}).encode("utf-8")
              self.send_response(200)
              self.send_header("Content-Type", "application/json")
              self.send_header("Content-Length", str(len(payload)))
              self.end_headers()
              self.wfile.write(payload)

            def log_message(self, format, *args):
              return

          with socketserver.TCPServer(("127.0.0.1", 0), Handler) as server:
            port = server.server_address[1]
            thread = threading.Thread(target=server.serve_forever, daemon=True)
            thread.start()
            try:
              result = subprocess.run(
                [
                  sys.executable,
                  str(helper_path),
                  "--metadata",
                  str(metadata_path),
                  "--api-base-url",
                  f"http://127.0.0.1:{port}",
                  "--json",
                ],
                check=True,
                capture_output=True,
                text=True,
              )

              payload = json.loads(result.stdout)
              assert payload["installed_version"] == "module-v1.0.0"
              assert payload["latest_release"] == "module-v1.3.0"
              assert payload["update_available"] is True

              legacy_metadata_path = target_dir / ".kicad-release-automation-version-legacy.json"
              legacy_metadata_path.write_text(
                json.dumps(
                  {
                    "module_repo": "example/kicad-release-automation-module",
                    "installed_version": "module-v1.0.0",
                  }
                ),
                encoding="utf-8",
              )

              legacy_result = subprocess.run(
                [
                  sys.executable,
                  str(helper_path),
                  "--metadata",
                  str(legacy_metadata_path),
                  "--api-base-url",
                  f"http://127.0.0.1:{port}",
                  "--json",
                ],
                check=True,
                capture_output=True,
                text=True,
              )
              legacy_payload = json.loads(legacy_result.stdout)
              assert legacy_payload["installed_version"] == "module-v1.0.0"
              assert legacy_payload["update_available"] is True
            finally:
              server.shutdown()
              thread.join()

          verify_result = subprocess.run(
            [
              sys.executable,
              str(helper_path),
              "--metadata",
              str(metadata_path),
              "--verify",
              "--json",
            ],
            check=True,
            capture_output=True,
            text=True,
          )
          verify_payload = json.loads(verify_result.stdout)
          assert verify_payload["verified"] is True
          assert verify_payload["valid"] is True
          assert len(verify_payload["files"]) == 6
          PY

      - name: Validate uninstall removes every managed file
        shell: bash
        run: |
          set -euo pipefail

          TARGET_DIR="$RUNNER_TEMP/kicad-target"
          ./uninstall.sh "$TARGET_DIR"

          test ! -e "$TARGET_DIR/.github/workflows/release-gerbers.yml"
          test ! -e "$TARGET_DIR/scripts/generate_release_artifacts.py"
          test ! -e "$TARGET_DIR/scripts/check_release_automation_update.py"
          test ! -e "$TARGET_DIR/scripts/find_kicad_cli.py"
          test ! -e "$TARGET_DIR/scripts/setup_kicad_cli_container.sh"
          test ! -e "$TARGET_DIR/scripts/package_release_artifacts.sh"
          test ! -e "$TARGET_DIR/.kicad-release-automation-version.json"
          test -f "$TARGET_DIR/release-artifacts.json"

  e2e-real-kicad:
    runs-on: ubuntu-latest
    env:
      INPUT_KICAD_IMAGE: ${{ inputs.kicad_image }}

    steps:
      - name: Checkout module repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install module into a two-project fixture repository
        shell: bash
        run: |
          set -euo pipefail

          TARGET_DIR="$RUNNER_TEMP/e2e-target"
          mkdir -p "$TARGET_DIR/hardware"
          cp -r tests/fixtures/board-v10 tests/fixtures/board-v9 "$TARGET_DIR/hardware/"

          cat > "$TARGET_DIR/release-artifacts.json" <<'JSON'
          {
            "defaults": {
              "gerber": {
                "include_layers": [
                  "F.Cu",
                  "B.Cu",
                  "F.SilkS",
                  "F.Mask",
                  "B.Mask",
                  "Edge.Cuts"
                ]
              }
            },
            "projects": [
              {
                "id": "board-v10",
                "path": "hardware/board-v10/board-v10.kicad_pro"
              },
              {
                "id": "board-v9",
                "path": "hardware/board-v9/board-v9.kicad_pro"
              }
            ]
          }
          JSON

          KICAD_RELEASE_AUTOMATION_VERSION="module-v0.0.0" \
            KICAD_RELEASE_AUTOMATION_REPO="example/kicad-release-automation-module" \
            ./install.sh "$TARGET_DIR"

          git -C "$TARGET_DIR" init -q
          git -C "$TARGET_DIR" add -A
          git -C "$TARGET_DIR" -c user.name="module-ci" -c user.email="module-ci@example.invalid" \
            commit -q -m "fixture"

      - name: Set up KiCad CLI (container)
        shell: bash
        run: |
          set -euo pipefail

          # Default to the image the workflow template uses, so this job tests
          # what targets will run.
          DEFAULT_IMAGE="$(sed -n 's/^  KICAD_IMAGE:[[:space:]]*//p' templates/.github/workflows/release-gerbers.yml)"
          if [[ -z "$DEFAULT_IMAGE" ]]; then
            echo "Could not read KICAD_IMAGE from the workflow template." >&2
            exit 1
          fi
          KICAD_IMAGE="${INPUT_KICAD_IMAGE:-$DEFAULT_IMAGE}"
          echo "KiCad image: $KICAD_IMAGE"
          echo "KICAD_IMAGE=$KICAD_IMAGE" >> "$GITHUB_ENV"

          TARGET_DIR="$RUNNER_TEMP/e2e-target"
          cd "$TARGET_DIR"
          SHIM="$(KICAD_CLI_MOUNT_DIR="$TARGET_DIR" \
            bash scripts/setup_kicad_cli_container.sh "$KICAD_IMAGE" "$RUNNER_TEMP/kicad-bin")"
          test -x "$SHIM"
          echo "KICAD_CLI=$SHIM" >> "$GITHUB_ENV"

      - name: Generate, verify and package each fixture project
        shell: bash
        run: |
          set -euo pipefail

          TARGET_DIR="$RUNNER_TEMP/e2e-target"
          cd "$TARGET_DIR"
          RUNNER_OWNER="$(id -u):$(id -g)"

          # board-v10 was saved by KiCad 10 and board-v9 by KiCad 9: both must plot
          # with the same CLI, one selected project at a time.
          for PROJECT_ID in board-v10 board-v9; do
            if [[ "$PROJECT_ID" == "board-v10" ]]; then
              OTHER_ID="board-v9"
            else
              OTHER_ID="board-v10"
            fi

            rm -rf .release-out
            rm -f ./*.zip

            python3 scripts/generate_release_artifacts.py \
              --config release-artifacts.json \
              --release 0.0.1 \
              --project-id "$PROJECT_ID" \
              --output-dir .release-out/gerber \
              --manifest .release-out/release-manifest.json

            OUT_DIR=".release-out/gerber/$PROJECT_ID"
            find .release-out -type f -printf '%p %s bytes owner=%U:%G\n' | sort

            # One Gerber per configured layer, plus a drill file, all non-empty.
            for SUFFIX in F_Cu B_Cu F_Silkscreen F_Mask B_Mask Edge_Cuts; do
              MATCHES=("$OUT_DIR/$PROJECT_ID-$SUFFIX".g*)
              if [[ ! -s "${MATCHES[0]}" ]]; then
                echo "Missing or empty Gerber for $SUFFIX in $OUT_DIR" >&2
                exit 1
              fi
            done
            test -s "$OUT_DIR/$PROJECT_ID.drl"

            # Nothing for the unselected project.
            test ! -e ".release-out/gerber/$OTHER_ID"

            # Everything the container wrote is owned by the runner user.
            FOREIGN="$(find .release-out ! -user "$(id -u)" -print)"
            if [[ -n "$FOREIGN" ]]; then
              echo "Files not owned by the runner user ($RUNNER_OWNER):" >&2
              echo "$FOREIGN" >&2
              exit 1
            fi

            PROJECT_ID="$PROJECT_ID" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          project_id = os.environ["PROJECT_ID"]
          manifest = json.loads(Path(".release-out/release-manifest.json").read_text(encoding="utf-8"))
          assert manifest["schema_version"] == 1
          assert manifest["release"] == "0.0.1"
          assert manifest["projects"] == [
            {
              "id": project_id,
              "project_file": f"hardware/{project_id}/{project_id}.kicad_pro",
              "output_dir": f".release-out/gerber/{project_id}",
              "release": "0.0.1",
            }
          ], manifest["projects"]
          PY

            # Same packaging script the workflow template calls.
            ZIP_LIST="$(bash scripts/package_release_artifacts.sh .release-out/release-manifest.json r0.0.1 "$PWD")"
            test "$ZIP_LIST" == "$PROJECT_ID-gerber-r0.0.1.zip"
            test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 1

            unzip -l "$ZIP_LIST"
            unzip -Z1 "$ZIP_LIST" > "$RUNNER_TEMP/zip-contents.txt"
            grep -q "^$PROJECT_ID-F_Cu\.g" "$RUNNER_TEMP/zip-contents.txt"
            grep -q "^$PROJECT_ID-Edge_Cuts\.g" "$RUNNER_TEMP/zip-contents.txt"
            grep -q "^$PROJECT_ID\.drl$" "$RUNNER_TEMP/zip-contents.txt"
            if grep -q "$OTHER_ID" "$RUNNER_TEMP/zip-contents.txt"; then
              echo "ZIP for $PROJECT_ID contains files of $OTHER_ID" >&2
              exit 1
            fi
          done
