name: Module Release

on:
  push:
    tags:
      - "module-v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout module repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^module-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' must match module-v#.#.#" >&2
            exit 1
          fi

          ARCHIVE_BASE="kicad-release-automation-module-${TAG}"
          TAR_NAME="${ARCHIVE_BASE}.tar.gz"
          SHA_NAME="${TAR_NAME}.sha256"

          {
            echo "tag=$TAG"
            echo "archive_base=$ARCHIVE_BASE"
            echo "tar_name=$TAR_NAME"
            echo "sha_name=$SHA_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Build module release archive
        shell: bash
        run: |
          set -euo pipefail

          PREFIX="${{ steps.meta.outputs.archive_base }}/"
          TAR_NAME="${{ steps.meta.outputs.tar_name }}"
          SHA_NAME="${{ steps.meta.outputs.sha_name }}"

          git archive --format=tar.gz --prefix="$PREFIX" -o "$TAR_NAME" "$GITHUB_SHA"
          sha256sum "$TAR_NAME" > "$SHA_NAME"

      - name: Upload release assets to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: module-release-assets-${{ steps.meta.outputs.tag }}
          path: |
            ${{ steps.meta.outputs.tar_name }}
            ${{ steps.meta.outputs.sha_name }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.meta.outputs.tar_name }}
            ${{ steps.meta.outputs.sha_name }}
