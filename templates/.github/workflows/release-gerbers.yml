name: Generate Release Gerbers

on:
  push:
    tags:
      - "r*.*.*"
      - "r/*/*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag: r#.#.# (legacy) or r/<project-id>/#.#.# (targeted)"
        required: false
        type: string
      project_ids:
        description: "Optional comma-separated project IDs for selective release"
        required: false
        type: string

permissions:
  contents: write

env:
  KICAD_IMAGE: kicad/kicad:10.0

jobs:
  build-gerbers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up KiCad CLI (container)
        shell: bash
        run: |
          set -euo pipefail

          # kicad-cli runs from the official KiCad container image through a small
          # shim, so the job itself stays on the hosted runner. The workspace is
          # mounted at the same absolute path inside the container, which keeps the
          # absolute paths passed by generate_release_artifacts.py valid.
          PULLED=0
          for ATTEMPT in 1 2 3; do
            if docker pull "$KICAD_IMAGE"; then
              PULLED=1
              break
            fi
            if [[ "$ATTEMPT" -lt 3 ]]; then
              DELAY=$((ATTEMPT * 15))
              echo "docker pull attempt $ATTEMPT failed; retrying in ${DELAY}s" >&2
              sleep "$DELAY"
            fi
          done
          if [[ "$PULLED" -ne 1 ]]; then
            echo "Could not pull KiCad image '$KICAD_IMAGE' after 3 attempts." >&2
            exit 1
          fi

          # Diagnostic: an entrypoint other than null would receive "kicad-cli" as
          # an argument instead of running it.
          echo "Image entrypoint/cmd:"
          docker inspect --format '{{json .Config.Entrypoint}} {{json .Config.Cmd}}' "$KICAD_IMAGE"

          KICAD_HOME="$RUNNER_TEMP/kicad-home"
          BIN_DIR="$RUNNER_TEMP/kicad-bin"
          SHIM="$BIN_DIR/kicad-cli"
          mkdir -p "$KICAD_HOME" "$BIN_DIR"

          # Image, workspace and home are baked in now; $PWD and "$@" are evaluated
          # each time the shim runs.
          {
            echo '#!/usr/bin/env bash'
            echo 'set -euo pipefail'
            printf 'KICAD_IMAGE=%q\n' "$KICAD_IMAGE"
            printf 'KICAD_WORKSPACE=%q\n' "$GITHUB_WORKSPACE"
            printf 'KICAD_HOME=%q\n' "$KICAD_HOME"
            echo 'exec docker run --rm --user "$(id -u):$(id -g)" -e HOME="$KICAD_HOME" -v "$KICAD_HOME:$KICAD_HOME" -v "$KICAD_WORKSPACE:$KICAD_WORKSPACE" -w "$PWD" "$KICAD_IMAGE" kicad-cli "$@"'
          } > "$SHIM"
          chmod +x "$SHIM"

          echo "$BIN_DIR" >> "$GITHUB_PATH"
          echo "KICAD_CLI=$SHIM" >> "$GITHUB_ENV"

          VERSION_OUTPUT="$("$SHIM" --version)"
          if [[ -z "$VERSION_OUTPUT" ]]; then
            echo "kicad-cli --version produced no output from image '$KICAD_IMAGE'." >&2
            exit 1
          fi
          echo "Using KiCad CLI shim at: $SHIM"
          echo "kicad-cli version: $VERSION_OUTPUT"

          # Diagnostics: the container must be able to write to its HOME and to the
          # workspace as the runner user, and files it creates must be owned by it.
          PROBE="$GITHUB_WORKSPACE/.kicad-cli-probe"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME="$KICAD_HOME" \
            -v "$KICAD_HOME:$KICAD_HOME" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" "$KICAD_IMAGE" \
            sh -c 'touch "$HOME/.probe" "$1"' sh "$PROBE"
          PROBE_OWNER="$(stat -c '%u:%g' "$PROBE")"
          rm -f "$PROBE" "$KICAD_HOME/.probe"
          echo "Container-written file owner: $PROBE_OWNER (runner: $(id -u):$(id -g))"
          if [[ "$PROBE_OWNER" != "$(id -u):$(id -g)" ]]; then
            echo "Files written by the KiCad container are not owned by the runner user." >&2
            exit 1
          fi

      - name: Resolve release context
        id: rel
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" && -n "${{ github.ref_name }}" ]]; then
            TAG="${{ github.ref_name }}"
          else
            echo "No release tag provided. For manual runs, set workflow input release_tag." >&2
            exit 1
          fi

          PROJECT_FROM_TAG=""
          RELEASE_VALUE=""
          RELEASE_LABEL=""
          if [[ "$TAG" =~ ^r([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            RELEASE_VALUE="${BASH_REMATCH[1]}"
            RELEASE_LABEL="r${RELEASE_VALUE}"
          elif [[ "$TAG" =~ ^r/([A-Za-z0-9._-]+)/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            PROJECT_FROM_TAG="${BASH_REMATCH[1]}"
            RELEASE_VALUE="${BASH_REMATCH[2]}"
            RELEASE_LABEL="r${RELEASE_VALUE}"
          else
            echo "Tag '$TAG' must match either r#.#.# or r/<project-id>/#.#.#" >&2
            exit 1
          fi

          INPUT_PROJECT_IDS="${{ inputs.project_ids }}"
          INPUT_PROJECT_IDS="${INPUT_PROJECT_IDS// /}"
          if [[ -n "$PROJECT_FROM_TAG" && -n "$INPUT_PROJECT_IDS" ]]; then
            echo "Do not set workflow input project_ids when tag already targets a project." >&2
            exit 1
          fi

          PROJECT_IDS_CSV="$INPUT_PROJECT_IDS"
          if [[ -n "$PROJECT_FROM_TAG" ]]; then
            PROJECT_IDS_CSV="$PROJECT_FROM_TAG"
          fi

          MODE="legacy"
          if [[ -n "$PROJECT_IDS_CSV" ]]; then
            MODE="selective"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_value=$RELEASE_VALUE" >> "$GITHUB_OUTPUT"
          echo "release_label=$RELEASE_LABEL" >> "$GITHUB_OUTPUT"
          echo "project_ids_csv=$PROJECT_IDS_CSV" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Validate legacy tag mode
        if: steps.rel.outputs.mode == 'legacy'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          config_path = Path("release-artifacts.json")
          if not config_path.exists():
              raise SystemExit(0)

          payload = json.loads(config_path.read_text(encoding="utf-8"))
          projects = payload.get("projects")
          if isinstance(projects, list) and projects:
              raise SystemExit(
                  "Legacy plain tag mode is not allowed when config uses projects[]. "
                  "Use targeted tag r/<project-id>/#.#.# or workflow_dispatch project_ids."
              )
          PY

      - name: Generate Gerber and drill files
        shell: bash
        run: |
          set -euo pipefail

          CMD=(
            python3 scripts/generate_release_artifacts.py
            --config release-artifacts.json
            --release "${{ steps.rel.outputs.release_value }}"
          )

          if [[ -n "${{ steps.rel.outputs.project_ids_csv }}" ]]; then
            IFS=',' read -r -a PROJECT_IDS <<< "${{ steps.rel.outputs.project_ids_csv }}"
            for PROJECT_ID in "${PROJECT_IDS[@]}"; do
              if [[ -n "$PROJECT_ID" ]]; then
                CMD+=(--project-id "$PROJECT_ID")
              fi
            done
          fi

          "${CMD[@]}"

      - name: Package gerber deliverables
        id: package
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_LABEL="${{ steps.rel.outputs.release_label }}"
          rm -f ./*.zip

          mapfile -t PROJECT_DIRS < <(find gerber -mindepth 1 -maxdepth 1 -type d | sort)

          ZIP_FILES=()
          if [[ "${#PROJECT_DIRS[@]}" -gt 0 ]]; then
            for PROJECT_DIR in "${PROJECT_DIRS[@]}"; do
              PROJECT_ID="$(basename "$PROJECT_DIR")"
              ZIP_NAME="${PROJECT_ID}-gerber-${RELEASE_LABEL}.zip"
              (
                cd "$PROJECT_DIR"
                zip -r "../../${ZIP_NAME}" .
              )
              ZIP_FILES+=("$ZIP_NAME")
            done
          else
            PROJECT_PATH="$(python3 -c 'import json; print(json.load(open("release-artifacts.json", "r", encoding="utf-8"))["project"]["path"])')"
            PROJECT_NAME="$(basename "$PROJECT_PATH" .kicad_pro)"

            if [[ -z "$PROJECT_NAME" ]]; then
              echo "Could not resolve project name from release-artifacts.json" >&2
              exit 1
            fi

            ZIP_NAME="${PROJECT_NAME}-gerber-${RELEASE_LABEL}.zip"
            (
              cd gerber
              zip -r "../${ZIP_NAME}" .
            )
            ZIP_FILES+=("$ZIP_NAME")
          fi

          if [[ "${#ZIP_FILES[@]}" -eq 0 ]]; then
            echo "No ZIP files produced." >&2
            exit 1
          fi

          {
            echo "zip_files<<EOF"
            for ZIP_FILE in "${ZIP_FILES[@]}"; do
              echo "$ZIP_FILE"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gerber-zips-${{ steps.rel.outputs.release_label }}
          path: ${{ steps.package.outputs.zip_files }}

      - name: Attach ZIPs to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          files: ${{ steps.package.outputs.zip_files }}
